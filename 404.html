  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sunan an-Nasa'i — Maktabah Maftoohah">
  <meta name="twitter:description" content="Koleksi Hadis Sunan an-Nasa'i lengkap dengan teks Arab berbaris penuh, terjemahan Melayu &amp; Inggeris, takhrij, dan carian pantas.">

  <script>
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var repoBase = '/';
      var subPath = pathname;
      if (pathname.indexOf('/sunan-an-nasai') === 0) {
        repoBase = '/sunan-an-nasai/';
        subPath = pathname.slice('/sunan-an-nasai'.length);
      }
      subPath = subPath.replace(/^\/+|\/+$/g, '');

      var targetHash = '';

      if (subPath) {
        var hadithMatch = subPath.match(/^(?:hadith\/|h\/)?(\d+(?:\.\d+)?)$/i);
        if (hadithMatch && hadithMatch[1] !== '404') {
          targetHash = '#hadith/' + hadithMatch[1];
        } else {
          var bookMatch = subPath.match(/^book\/(\d+)(?:\/(\d+))?$/i);
          if (bookMatch) {
            targetHash = bookMatch[2] 
              ? '#book/' + bookMatch[1] + '/' + bookMatch[2] 
              : '#book/' + bookMatch[1];
          } else if (hash) {
            targetHash = hash;
          }
        }
      } else if (hash) {
        targetHash = hash;
      }

      var redirectUrl = repoBase + search + targetHash;
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
